<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Work</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-row">
        <h1>Work</h1>
        <ul id="sources" class="sources-strip" aria-label="Source freshness"></ul>
        <button id="refresh" type="button">
          <svg aria-hidden="true" viewBox="0 0 20 20" width="18" height="18"><path d="M16 10a6 6 0 1 1-1.76-4.24M16 3.5V6h-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <span id="refresh-label">Refresh</span>
        </button>
      </div>
      <nav aria-label="Work views">
        <a href="?view=mine">My PRs<span class="count" data-count="mine"></span></a><a href="?view=reviews">Reviews<span class="count" data-count="reviews"></span></a><a href="?view=slack">Slack</a><a href="?view=prompts">Prompts</a>
      </nav>
    </header>
    <div class="page">
      <p id="notice" role="status" aria-live="polite">Loading…</p>
      <p id="dispatch" class="callout" hidden></p>
      <main id="content"></main>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
