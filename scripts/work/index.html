<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Work</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-row">
        <h1>Work</h1>
        <nav aria-label="Work views">
          <a href="?view=mine"><span>My PRs</span><span class="count" data-count="mine"></span></a><a href="?view=reviews"><span>Reviews</span><span class="count" data-count="reviews"></span></a><a href="?view=slack"><span>Slack</span></a><a href="?view=prompts"><span>Prompts</span></a>
        </nav>
        <div class="tools">
          <button id="dispatch" class="delivery" type="button" aria-expanded="false" aria-controls="dispatch-text" aria-describedby="dispatch-text" hidden><span class="dot" aria-hidden="true"></span>Morning delivery issue</button>
          <button id="refresh" type="button">
            <svg aria-hidden="true" viewBox="0 0 20 20" width="18" height="18"><path d="M16 10a6 6 0 1 1-1.76-4.24M16 3.5V6h-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <span id="refresh-label">Refresh</span>
          </button>
        </div>
      </div>
      <p id="dispatch-text" hidden></p>
    </header>
    <div class="page">
      <p id="notice" class="loading" role="status" aria-live="polite">Loading…</p>
      <div id="source" class="source-line" hidden>
        <p class="source"><span id="source-name"></span><span id="source-time"></span></p>
        <details id="gap" class="coverage" hidden><summary></summary><p></p></details>
      </div>
      <main id="content"></main>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
